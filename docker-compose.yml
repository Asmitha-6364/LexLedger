services:
  postgres:
    image: postgres:16
    container_name: lexledger-postgres
    environment:
      POSTGRES_DB: lexledger
      POSTGRES_USER: lexledger
      POSTGRES_PASSWORD: lexledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexledger -d lexledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
